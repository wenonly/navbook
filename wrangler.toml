name = "navbook"
main = "workers/src/index.ts"
compatibility_date = "2026-09-10"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "nav.wenonly.cn", custom_domain = true }
]

[vars]
USERNAME = "admin"

[[d1_databases]]
binding = "DB"
# 2026-09-16 自 onenav-db 迁入（export→import 全量数据；旧库 onenav-db 暂留，待手动删除）
database_name = "navbook"
database_id = "740dd82d-c4f2-4e8f-b581-1fc0126c5ba4"
migrations_dir = "workers/src/db/migrations"

[assets]
directory = "workers/dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

# AI 助手后台回合:每会话一个 DO(断连续跑/重挂续流;Free 计划 SQLite-backed)
[durable_objects]
bindings = [
  { name = "AGENT", class_name = "AgentTurnDO" }
]

[[migrations]]
tag = "v1_do_agent"
new_sqlite_classes = ["AgentTurnDO"]
