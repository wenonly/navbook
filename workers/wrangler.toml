name = "onenav-workers"
main = "src/index.ts"
compatibility_date = "2026-09-10"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "nav.wenonly.cn", custom_domain = true }
]

[vars]
USERNAME = "admin"

[[d1_databases]]
binding = "DB"
database_name = "onenav-db"
# real remote D1 id (created via 'wrangler d1 create onenav-db', Task 19); local dev still uses miniflare's local D1
database_id = "6745abcd-6c72-4f6f-9731-7b1b87316ecc"
migrations_dir = "src/db/migrations"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"
